<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!--
      Privacy (DECISIONS D8, ARCHITECTURE section 9): nothing leaves the device. connect-src blocks every
      third-party call, including MediaPipe's usage telemetry to odml.pa.googleapis.com. 'wasm-unsafe-eval'
      lets the local MediaPipe wasm compile; worker-src blob: is for the pose worker's blob bootstrap, which
      makes the worker inherit this policy. Keep this tag before any script, style or link. The same policy
      is in validation.html.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- Sets data-theme / data-contrast before first paint (DESIGN §13.3). Same-origin, so the CSP allows it. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Serve Coach: a virtual serve coach for recreational tennis players." />
    <title>Serve Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
