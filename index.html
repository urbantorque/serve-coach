<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Only the display face is preloaded. It sets the hero score, which is the
      first thing on the page and the one place a font swap is a visible jolt;
      the body face swaps inside a paragraph where nobody notices. Georgia is
      the fallback, so the jolt is serif-to-serif even when it happens.
    -->
    <link
      rel="preload"
      href="/fonts/libre-baskerville-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="apple-mobile-web-app-title" content="Serve Coach" />
    <meta
      name="description"
      content="Frame-by-frame tennis serve analysis that runs entirely on your device. Your video never leaves your phone."
    />
    <title>Serve Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
